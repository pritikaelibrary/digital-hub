<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pritika Group - Digital Hub Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER BAND -->
<div class="header-band">

    <img src="logo.png" class="header-logo">

    <h1>Pritika Group Digital Hub</h1>

    <p class="sub-heading">  "Empowering Excellence through Integrated Knowledge”</p>

</div>

<!-- MAIN CONTENT -->
<div class="main-container">

    <div class="card" style="max-width:450px; margin:auto; text-align:center;">

        <h2 style="margin-bottom:20px;">Employee Registration</h2>

        <div id="messageBox" style="display:none; margin-bottom:15px;"></div>

        <form id="signupForm">

            <input type="text" id="name" placeholder="Employee Name" required><br>

            <input type="email" id="email" placeholder="Employee Email ID" required><br>

            <input type="password" id="password" placeholder="Create Password" required><br>

            <!-- Department Dropdown -->
            <select id="department" required>
                <option value="">Select Department</option>
                <option value="Management">Management</option>
                <option value="Operations">Operations</option>
                <option value="Foundry">Foundry</option>
                <option value="Machining">Machining</option>
                <option value="Quality">Quality</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Design">Design</option>
                <option value="Marketing">Marketing</option>
                <option value="Accounts">Accounts</option>
 			    <option value="Stores">Stores</option>
 				<option value="Purchase">Purchase</option>
                <option value="HR">HR</option>
                <option value="IT">IT</option>
               
            </select><br>

            <!-- Location Dropdown -->
            <select id="location" required>
                <option value="">Select Location</option>
                <option value="Mohali">Mohali</option>
                <option value="Derabassi">Derabassi</option>
                <option value="Hoshiarpur">Hoshiarpur</option>
                <option value="Una">Una</option>
            </select><br>

            <button type="submit" class="btn" style="width:100%; margin-top:10px;">
                Register
            </button>

        </form>

        <p style="margin-top:15px; font-size:13px;">
            Already have an account?
            <a href="index.html" style="color:#b52b2b; font-weight:500;">
                Login Here
            </a>
        </p>

    </div>

</div>


<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbwrehottqwjnBVS5Srg6fqmEFg_jtSknJyl0bT6castwvn1sf10AUyOzjxCkxyrVZ3YTg/exec";

const form = document.getElementById("signupForm");
const messageBox = document.getElementById("messageBox");

form.addEventListener("submit", function(e){
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const department = document.getElementById("department").value;
    const location = document.getElementById("location").value;

    if(!department || !location){
        showMessage("Please select Department and Location.", false);
        return;
    }

    fetch(scriptURL,{
        method:"POST",
        body: JSON.stringify({
            action:"signup",
            name:name,
            email:email,
            password:password,
            department:department,
            location:location
        })
    })
    .then(res=>res.text())
    .then(result=>{

        if(result === "Signup Success"){
            showMessage("Registration Successful! Redirecting to Login...", true);
            setTimeout(()=>window.location.href="index.html",1500);
        }
        else if(result === "Email Exists"){
            showMessage("Email already registered.", false);
        }
        else{
            showMessage("Error! Please try again.", false);
        }

    })
    .catch(()=>showMessage("Server Error. Try Again.", false));
});

function showMessage(message, success){

    messageBox.style.display="block";
    messageBox.style.padding="10px";
    messageBox.style.borderRadius="6px";

    if(success){
        messageBox.style.background="#e8f5e9";
        messageBox.style.color="#2e7d32";
    }else{
        messageBox.style.background="#fdecea";
        messageBox.style.color="#c62828";
    }

    messageBox.innerText=message;
}

</script>

</body>
</html>
