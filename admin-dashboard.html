<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pritika Group - Admin Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER BAND -->
<div class="header-band" style="position:relative;">

   

    <img src="logo.png" class="header-logo">

    <h1>Pritika Group Digital Hub</h1>

    <p class="sub-heading">
        Admin Control Panel - Manage Employee Access
    </p>

</div>

<!-- MAIN CONTENT -->
<div class="main-container">

    <!-- ACTION BUTTONS -->
    <div style="text-align:center; margin-bottom:20px;">
        <button class="btn" onclick="openAddForm()">Add User</button>
        <button class="btn" style="background:#f0ad4e;" onclick="editUser()">Edit User</button>
        <button class="btn" style="background:#d9534f;" onclick="deleteUser()">Delete User</button>
        <button class="btn" style="float:right;" onclick="logout()">Logout</button>
    </div>

    <!-- ADD USER FORM -->
    <div class="card" id="addUserForm" style="display:none; margin-bottom:25px; text-align:center;">
        <h3>Add New User</h3>

        <input type="text" id="newName" placeholder="Employee Name" required>
        <input type="email" id="newEmail" placeholder="Email" required>
        <input type="password" id="newPassword" placeholder="Password" required>

        <select id="newDepartment" required>
            <option value="">Select Department</option>
            <option>HR</option>
            <option>Production</option>
            <option>Quality</option>
            <option>Maintenance</option>
            <option>Accounts</option>
            <option>IT</option>
            <option>Stores</option>
        </select>

        <select id="newLocation" required>
            <option value="">Select Location</option>
            <option>Ludhiana</option>
            <option>Hoshiarpur</option>
            <option>Jalandhar</option>
            <option>Corporate Office</option>
        </select>

        <br><br>
        <button class="btn" onclick="saveNewUser()">Save User</button>
        <button class="btn" style="background:#999;" onclick="closeAddForm()">Cancel</button>
    </div>

    <!-- USER TABLE -->
    <div class="card">
        <table id="userTable"></table>
    </div>

</div>


<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbwrehottqwjnBVS5Srg6fqmEFg_jtSknJyl0bT6castwvn1sf10AUyOzjxCkxyrVZ3YTg/exec";
let selectedRowIndex = null;

/* ===== LOAD USERS ===== */
function loadUsers(){
    fetch(scriptURL,{
        method:"POST",
        body: JSON.stringify({action:"fetchUsers"})
    })
    .then(res=>res.json())
    .then(data=>{

        let table = `
        <tr>
            <th>Select</th>
            <th>S.No</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Location</th>
        </tr>`;

        for(let i=1;i<data.length;i++){
            table += `
            <tr>
                <td><input type="radio" name="selectUser" onclick="selectRow(${i+1})"></td>
                <td>${data[i][0]}</td>
                <td>${data[i][1]}</td>
                <td>${data[i][2]}</td>
                <td>${data[i][4]}</td>
                <td>${data[i][5]}</td>
            </tr>`;
        }

        document.getElementById("userTable").innerHTML = table;
        selectedRowIndex = null;
    });
}

function selectRow(index){
    selectedRowIndex = index;
}

/* ===== ADD USER ===== */
function openAddForm(){
    document.getElementById("addUserForm").style.display="block";
}

function closeAddForm(){
    document.getElementById("addUserForm").style.display="none";
}

function saveNewUser(){

    const name = newName.value.trim();
    const email = newEmail.value.trim();
    const password = newPassword.value.trim();
    const department = newDepartment.value;
    const location = newLocation.value;

    if(!name || !email || !password || !department || !location){
        alert("Please fill all fields.");
        return;
    }

    fetch(scriptURL,{
        method:"POST",
        body: JSON.stringify({
            action:"addUser",
            name:name,
            email:email,
            password:password,
            department:department,
            location:location
        })
    })
    .then(res=>res.text())
    .then(response=>{
        if(response==="Added"){
            alert("User Added Successfully");
            closeAddForm();
            newName.value="";
            newEmail.value="";
            newPassword.value="";
            newDepartment.value="";
            newLocation.value="";
            loadUsers();
        }
    });
}

/* ===== EDIT USER ===== */
function editUser(){

    if(!selectedRowIndex){
        alert("Please select a user first.");
        return;
    }

    const name = prompt("Enter New Name:");
    const email = prompt("Enter New Email:");
    const department = prompt("Enter Department:");
    const location = prompt("Enter Location:");

    fetch(scriptURL,{
        method:"POST",
        body: JSON.stringify({
            action:"updateUser",
            rowIndex:selectedRowIndex,
            name:name,
            email:email,
            department:department,
            location:location
        })
    })
    .then(()=>loadUsers());
}

/* ===== DELETE USER ===== */
function deleteUser(){

    if(!selectedRowIndex){
        alert("Please select a user first.");
        return;
    }

    if(confirm("Delete selected user?")){
        fetch(scriptURL,{
            method:"POST",
            body: JSON.stringify({
                action:"deleteUser",
                rowIndex:selectedRowIndex
            })
        })
        .then(()=>loadUsers());
    }
}

function logout(){
    window.location.href="index.html";
}

loadUsers();

</script>

</body>
</html>
